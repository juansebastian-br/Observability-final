# Only for self-managed Istio (istioctl install). Not used with managed Cloud Service Mesh
# (TRAFFIC_DIRECTOR): there, tracing uses the built-in `stackdriver` provider in istio-telemetry.yaml.
meshConfig:
  extensionProviders:
    - name: otel-tracing
      opentelemetry:
        service: otel-collector.observability-lab.svc.cluster.local
        port: 4317

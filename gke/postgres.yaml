apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: observability-lab
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS orders (
        order_id UUID PRIMARY KEY,
        customer_id VARCHAR(100) NOT NULL,
        amount NUMERIC(14,2) NOT NULL,
        currency VARCHAR(3) NOT NULL,
        status VARCHAR(30) NOT NULL,
        created_at TIMESTAMPTZ NOT NULL
    );
    
    CREATE TABLE IF NOT EXISTS payments (
        id BIGSERIAL PRIMARY KEY,
        order_id UUID NOT NULL,
        amount NUMERIC(14,2) NOT NULL,
        currency VARCHAR(3) NOT NULL,
        status VARCHAR(30) NOT NULL,
        created_at TIMESTAMPTZ NOT NULL
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: observability-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
      annotations: {sidecar.istio.io/inject: "false"}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [{containerPort: 5432}]
          envFrom: [{secretRef: {name: local-postgres-auth}}]
          # Password lives in its own Secret; app-db-url must use the same user/db/password.
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}}
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: init
          configMap: {name: postgres-init}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: observability-lab
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]

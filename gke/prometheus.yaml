apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: observability-lab}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: collector
        static_configs:
          - targets: ['otel-collector:8889']
      - job_name: istio-proxies
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [observability-lab]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: istio-proxy
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: '$1:15090'
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: observability-lab}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: observability-lab-prometheus}
rules:
  - apiGroups: ['']
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: observability-lab-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: observability-lab-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: observability-lab}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: observability-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ['--config.file=/etc/prometheus/prometheus.yml']
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes: [{name: config, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: observability-lab}
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: 9090}]

apiVersion: networking.istio.io/v1
kind: Gateway
metadata: {name: orders-gateway, namespace: observability-lab}
spec:
  selector: {istio: ingressgateway}
  servers:
    - port: {number: 80, name: http, protocol: HTTP}
      hosts: ['*']
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: {name: orders-route, namespace: observability-lab}
spec:
  hosts: ['*']
  gateways: [orders-gateway]
  http:
    - match: [{uri: {prefix: /orders}}, {uri: {exact: /health}}]
      route:
        - destination: {host: orders-service, port: {number: 8000}}
